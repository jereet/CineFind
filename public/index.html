<!DOCTYPE html>
<html lang="es" class="bg-slate-950">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" />
    <title>Cinefind — Buscador de películas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            },
            colors: {
              ink: '#020617',
              violet: '#8b5cf6',
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
    <div class="pointer-events-none fixed inset-0 overflow-hidden" aria-hidden="true">
      <div class="absolute left-1/2 top-[-18rem] h-[36rem] w-[36rem] -translate-x-1/2 rounded-full bg-violet-600/10 blur-3xl"></div>
    </div>

    <header class="relative border-b border-white/[0.06]">
      <div class="mx-auto max-w-6xl px-5 pb-10 pt-8 sm:px-8 sm:pb-14 sm:pt-12">
        <div class="mb-12 flex items-center justify-between">
          <a href="/" class="flex items-center gap-3 text-sm font-semibold tracking-tight text-white">
            <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-violet-500/15 text-violet-300 ring-1 ring-inset ring-violet-400/20">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="m7 4 10 16M17 4 7 20M4 8h16M4 16h16M5 4h.01M19 4h.01M5 20h.01M19 20h.01" />
              </svg>
            </span>
            Cinefind
          </a>
          <span class="hidden text-xs font-medium uppercase tracking-[0.2em] text-slate-500 sm:block">Catálogo de películas</span>
        </div>

        <div class="max-w-3xl">
          <p class="mb-4 text-sm font-medium text-violet-300">Explorá algo nuevo</p>
          <h1 class="max-w-2xl text-4xl font-semibold tracking-[-0.04em] text-white sm:text-6xl">
            Encontrá tu próxima película favorita.
          </h1>
          <p class="mt-5 max-w-xl text-base leading-7 text-slate-400">
            Buscá por título y descubrí películas del catálogo en segundos.
          </p>

          <form id="search-form" class="mt-8 flex max-w-2xl flex-col gap-3 sm:flex-row" autocomplete="off">
            <label class="relative block flex-1">
              <span class="sr-only">Término de búsqueda</span>
              <svg class="pointer-events-none absolute left-4 top-1/2 -translate-y-1/2 text-slate-500" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-4-4"></path>
              </svg>
              <input id="search-input" class="h-14 w-full rounded-2xl border border-white/10 bg-white/[0.06] pl-12 pr-4 text-base text-white outline-none transition placeholder:text-slate-500 hover:border-white/20 focus:border-violet-400/70 focus:bg-white/[0.08] focus:ring-4 focus:ring-violet-500/10" type="search" placeholder="Buscar por título..." aria-label="Término de búsqueda" />
            </label>
            <button id="search-button" class="h-14 rounded-2xl bg-violet-500 px-7 text-sm font-semibold text-white shadow-lg shadow-violet-950/30 transition hover:bg-violet-400 focus:outline-none focus:ring-4 focus:ring-violet-500/30 active:scale-[0.98]" type="submit">
              Buscar
            </button>
          </form>
        </div>
      </div>
    </header>

    <main class="relative mx-auto max-w-6xl px-5 pb-16 pt-8 sm:px-8 sm:pt-10">
      <div class="mb-6 flex min-h-6 items-center justify-between gap-4">
        <p id="status" class="text-sm text-slate-400" role="status" aria-live="polite"></p>
        <span id="result-count" class="hidden rounded-full border border-white/10 bg-white/[0.04] px-3 py-1 text-xs font-medium text-slate-400"></span>
      </div>
      <section id="results" class="grid grid-cols-2 gap-4 sm:grid-cols-3 sm:gap-5 lg:grid-cols-5" aria-live="polite">
        <div class="col-span-full flex flex-col items-center justify-center rounded-3xl border border-dashed border-white/10 px-6 py-20 text-center">
          <span class="mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-white/[0.05] text-slate-500">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <path d="m4 7 8-4 8 4v10l-8 4-8-4V7Z"></path>
              <path d="m4 7 8 4 8-4M12 11v10"></path>
            </svg>
          </span>
          <h2 class="text-base font-medium text-slate-300">Tu próxima historia empieza acá</h2>
          <p class="mt-2 text-sm text-slate-500">Escribí un título para explorar el catálogo.</p>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
